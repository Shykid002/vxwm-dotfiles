
swipe_threshold 5

# Swipe up with 3 fingers to move the vxwm canvas up
gesture swipe up 3 xdotool key super+shift+Up

# Swipe down with 3 fingers to move the vxwm canvas down
gesture swipe down 3 xdotool key super+shift+Down

# Swipe left with 3 fingers to move the vxwm canvas left
gesture swipe left 3 xdotool key super+shift+Left

# Swipe right with 3 fingers to move the vxwm canvas right
gesture swipe right 3 xdotool key super+shift+Right



